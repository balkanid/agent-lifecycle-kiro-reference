name: Agent approval

# Required status check: a pull request may only change a Kiro agent if that exact config has a
# live AGENT_ACCESS approval in BalkanID.
#
# Hardening:
# - Runs on every PR (no path filter) so the required check always reports; it passes quickly
#   when no agent changed.
# - Verifies with scripts from the BASE branch. The PR's own scripts never run with secrets,
#   so a PR cannot edit the verifier to pass or read the API key.
# - The agent-approval environment should require reviewers; fork PRs receive no secrets and fail closed.

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    environment: agent-approval
    steps:
      - name: Check out base branch (trusted verifier)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out pull request (data only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify BalkanID approval for changed agents
        env:
          BALKANID_PUBLIC_API_URL: ${{ secrets.BALKANID_PUBLIC_API_URL }}
          API_KEY_ID: ${{ secrets.BALKANID_API_KEY_ID }}
          API_KEY_SECRET: ${{ secrets.BALKANID_API_KEY_SECRET }}
          BALKANID_SKIP_DOTENV: "1"
          BALKANID_KIRO_ROOT: ${{ github.workspace }}/pr
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cd pr
          changed="$(git diff --name-only "$BASE_SHA"...HEAD -- .kiro/agents .kiro/balkanid | sort -u)"
          if [ -z "$changed" ]; then
            echo "No Kiro agent changes; nothing to verify."
            exit 0
          fi
          agents="$(printf '%s\n' "$changed" | grep -E '^\.kiro/agents/[^/]+\.json$' | xargs -r -n1 basename | sed 's/\.json$//' || true)"
          if printf '%s\n' "$changed" | grep -q '^\.kiro/balkanid/'; then
            # Registrations or guardrails changed: re-verify every agent on disk.
            agents="$(ls .kiro/agents/*.json 2>/dev/null | xargs -r -n1 basename | sed 's/\.json$//')"
          fi
          status=0
          for name in $agents; do
            [ -f ".kiro/agents/$name.json" ] || continue   # deleted agents need no approval
            python3 "$GITHUB_WORKSPACE/base/scripts/register_agent.py" --agent "$name" --verify || status=1
          done
          exit "$status"
