name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compile and import
        run: |
          python3 -m py_compile scripts/*.py tests/*.py
          python3 scripts/verify_imports.py

      - name: Unit tests (mock BalkanID API)
        run: python3 -m unittest discover -s tests -v

      - name: Lint every Kiro agent config
        run: |
          shopt -s nullglob
          for f in .kiro/agents/*.json; do
            name="$(basename "$f" .json)"
            python3 scripts/register_agent.py --agent "$name" --lint-only
          done

      - name: Validate JSON
        run: |
          for f in .kiro/agents/*.json .kiro/balkanid/*.json; do jq empty "$f"; done

      - name: Block tracked secret files
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.tfstate|\.tfvars$'; then
            echo "Sensitive files must not be tracked"
            exit 1
          fi

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/03d0035246f3e81f36aed592ffb4bebf33a03106/scripts/download-actionlint.bash) 1.7.7
          ./actionlint

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          extra_args: --only-verified
